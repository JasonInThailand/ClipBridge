name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained exe
        run: dotnet publish -c Release

      - name: Publish framework-dependent exe (small, needs .NET 8 Desktop Runtime)
        run: dotnet publish -c Release --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out-fd

      - name: Assemble packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/ClipBridge.exe pkg/ClipBridge.exe
          Copy-Item out-fd/ClipBridge.exe pkg/ClipBridge-framework-dependent.exe
          Copy-Item install.ps1, "Install ClipBridge.cmd", README.md, LICENSE pkg/
          Compress-Archive -Path pkg/ClipBridge.exe, pkg/install.ps1, "pkg/Install ClipBridge.cmd", pkg/README.md, pkg/LICENSE -DestinationPath ClipBridge-win-x64.zip
          Compress-Archive -Path pkg/ClipBridge-framework-dependent.exe, pkg/install.ps1, "pkg/Install ClipBridge.cmd", pkg/README.md, pkg/LICENSE -DestinationPath ClipBridge-win-x64-framework-dependent.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge
          path: |
            ClipBridge-win-x64.zip
            ClipBridge-win-x64-framework-dependent.zip

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClipBridge-win-x64.zip
            ClipBridge-win-x64-framework-dependent.zip
          generate_release_notes: true
